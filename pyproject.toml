[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-refine"
version = "1.0.0"
description = "Edge-Preserving Depth Map Upsampling and Refinement (ProbID - P4)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "opencv-python>=4.9.0",
    "h5py>=3.10.0",
    "scikit-image>=0.22.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "einops>=0.7.0",
    "Pillow>=10.2.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

